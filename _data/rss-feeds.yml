# News & Signals — source configuration
# Edit this file to review sources, add feeds, or disable a source.
# Configuration only: the RSS fetcher and scheduled refresh are not installed yet.
# Feed URLs are candidates pending end-to-end fetch/parse validation.
# enabled selects a source for inclusion once the integration is implemented.
#
# To add a source, copy one block below and give it a unique id.
# category must match one of the category IDs listed below.
# Set enabled: false to pause a source without deleting its settings.
# Use a public RSS/Atom URL, not the site's ordinary article page.
# This repository is public; do not put credentials or private feed tokens here.

version: 1

categories:
  - id: offensive-security
    label: Offensive Security
  - id: cybersecurity
    label: Cybersecurity
  - id: ai
    label: AI
  - id: tech-architecture
    label: Tech & Architecture

# Intended defaults for the forthcoming integration.
settings:
  max_items_per_source: 3
  max_items_total: 36

